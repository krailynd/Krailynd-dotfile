# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║                         ALACRITTY CONFIGURATION                              ║
# ║                              Theme: Miasma                                   ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

[font]
size = 12

[font.normal]
family = "IosevkaTerm NF"
style = "Regular"

[font.bold]
family = "IosevkaTerm NF"
style = "Bold"

[font.italic]
family = "IosevkaTerm NF"
style = "Italic"

[font.bold_italic]
family = "IosevkaTerm NF"
style = "Bold Italic"

[window]
decorations = "Full"
decorations_theme_variant = "Dark"
opacity = 0.95
blur = true
option_as_alt = "Both"

[window.padding]
x = 8
y = 0

[cursor]
style = "Block"
blink_interval = 500
unfocused_hollow = true
vi_mode_style = "Block"

[terminal]

[env]
TERM = "xterm-256color"

[hints]
enabled = []

# ┌──────────────────────────────────────────────────────────────────────────────┐
# │                            MIASMA COLOR THEME                                │
# └──────────────────────────────────────────────────────────────────────────────┘

[colors]
indexed_colors = [{ index = 16, color = "0x222222" }]

# Primary colors
[colors.primary]
background = "#222222"
foreground = "#c2c2b0"

# Normal colors
[colors.normal]
black   = "#222222"
red     = "#685742"
green   = "#5f875f"
yellow  = "#b36d43"
blue    = "#78824b"
magenta = "#bb7744"
cyan    = "#c9a554"
white   = "#d7c483"

# Bright colors
[colors.bright]
black   = "#666666"
red     = "#685742"
green   = "#5f875f"
yellow  = "#b36d43"
blue    = "#78824b"
magenta = "#bb7744"
cyan    = "#c9a554"
white   = "#d7c483"
