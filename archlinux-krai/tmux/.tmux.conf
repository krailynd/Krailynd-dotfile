# === tmux 3.x config — organizado por secciones ===
# Copia de seguridad: ~/tmux-backups/backup-2026-08-17_20-21-54/

# ---------- Terminal ----------
set -g default-terminal "tmux-256color"
set -ga terminal-features ",xterm-256color:cstyle"
set -ga terminal-features ",alacritty:cstyle"
# Passthrough para kitty graphics protocol (imágenes de snacks.nvim en WezTerm)
set -g allow-passthrough on
set -ga terminal-features ",xterm-256color:kitty-graphics"
set -ga terminal-features ",wezterm:kitty-graphics"
set -g escape-time 10
set -g focus-events on

# ---------- Prefijo ----------
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# ---------- Índices ----------
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# ---------- Ratón y posición de la barra ----------
set -g mouse on
set -g status-position bottom

# ---------- Ventanas/paneles en el directorio actual ----------
bind c new-window -c '#{pane_current_path}'
bind '"' split-window -v -c '#{pane_current_path}'
bind % split-window -h -c '#{pane_current_path}'

# ---------- Navegación de paneles (estilo vim) ----------
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ---------- Ventana flotante: target (Ctrl+a + e) ----------
bind e display-popup -w 60% -h 20% -E '~/.tmux-target-prompt.sh'

# ---------- Plugins (TPM) ----------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'wfxr/tmux-power'
set -g @tmux_power_theme '#5FAE4E'

run '~/.tmux/plugins/tpm/tpm'

# ============================================================
# Barra de estado: islas minimalistas (sobrescribe tmux-power)
#   izquierda -> usuario
#   centro    -> ventanas
#   derecha   -> ruta actual | target | HTB | THM
# ============================================================
set -g status-bg default
set -g status-fg "#d0d0d0"
set -g status-style "bg=default,fg=#d0d0d0"
set -g status-justify centre
set -g status-interval 1

# Píldora de usuario (verde) + ruta (blanca) — izquierda
set -g status-left-length 260
set -g status-left "#[fg=#5FAE4E,bg=default]\ue0b6#[bg=#5FAE4E,fg=#121212,bold] #{USER}: #{pane_current_command} #[fg=#5FAE4E,bg=default]\ue0b4 #[fg=#ffffff,bg=default]\ue0b6#[bg=#ffffff,fg=#000000] \uf07b #{pane_current_path} #[fg=#ffffff,bg=default]\ue0b4"

# Píldoras de ventanas (centro)
set -g window-status-format "#[fg=#2a2a2a,bg=default]\ue0b6#[bg=#2a2a2a,fg=#5FAE4E] #I:#W #[fg=#2a2a2a,bg=default]\ue0b4"
set -g window-status-current-format "#[fg=#5FAE4E,bg=default]\ue0b6#[bg=#5FAE4E,fg=#121212,bold] #I:#W #[fg=#5FAE4E,bg=default]\ue0b4"
set -g window-status-separator " "
set -g window-status-activity-style "fg=#5FAE4E,bold"
set -g window-status-bell-style "fg=#ff5555,bold"

# Píldoras derecha: target | HTB | THM (+ indicador de prefijo)
set -g status-right-length 220
set -g status-right "#{?client_prefix,#[fg=#5FAE4E,bg=default]\ue0b6#[bg=#5FAE4E,fg=#121212,bold] PREFIX #[fg=#5FAE4E,bg=default]\ue0b4 ,}#[fg=#ff5555,bg=default]\ue0b6#[bg=#ff5555,fg=#ffffff] \uf05b #{?#{==:#{TMUX_TARGET},},target: \u2014,target: #{TMUX_TARGET}} #[fg=#ff5555,bg=default]\ue0b4 #[fg=#5FAE4E,bg=default]\ue0b6#[bg=#5FAE4E,fg=#121212] \uf1b2 HTB #[fg=#5FAE4E,bg=default]\ue0b4 #[fg=#38bdf8,bg=default]\ue0b6#[bg=#38bdf8,fg=#121212] \u2694 THM #[fg=#38bdf8,bg=default]\ue0b4"
