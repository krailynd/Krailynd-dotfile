# ============================================================================
# ~/.tmux.conf — systems engineering / AI / cybersecurity workstation
# minimal · monochrome (gray/white/black) · transparent · prefix = Ctrl+a
# ============================================================================

set -g default-shell /bin/zsh

# ---- Terminal / key handling (fixes SSH key delivery + rendering) ---------
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",xterm-256color:RGB"
set -as terminal-overrides ",tmux-256color:RGB"
set -sg escape-time 10
set -g repeat-time 300
set -g focus-events on
setw -g xterm-keys on
set -g mode-keys vi
set -g status-keys emacs

# ---- Prefix ------------------------------------------------------------------
unbind C-b
set -g prefix C-a
bind C-a send-prefix
set -g prefix2 C-b

# ---- General behavior -------------------------------------------------------
set -g mouse on
set -g history-limit 100000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-titles on
set -g set-titles-string "#T"
set -g allow-rename off
set -g automatic-rename off
set -g bell-action any
set -g visual-bell off
set -g visual-activity off
setw -g monitor-activity on
setw -g monitor-bell on
set -g set-clipboard on

bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# ---- Panes / windows ---------------------------------------------------------
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind S set-window-option synchronize-panes \; display-message "synchronize-panes: #{?synchronize-panes,ON,OFF}"

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel

# ---- Pentesting / recon quality-of-life --------------------------------------
bind i display-popup -E -w 70% -h 50% "ip -brief -c addr show; echo; echo Press any key to close; read -n1"
bind T command-prompt -p "target IP/host:" "run-shell 'echo \"%%\" > ~/.tmux_target'"
bind C-T run-shell "rm -f ~/.tmux_target; tmux display-message 'target cleared'"

# ---- THEME: monochrome, transparent, rounded pill segments -----------------
set -g pane-border-status off
set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-interval 5

set -g status-style "bg=default,fg=colour250"
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour252"
set -g display-panes-colour colour238
set -g display-panes-active-colour colour255
set -g message-style "bg=colour235,fg=colour253"
set -g message-command-style "bg=colour235,fg=colour253"
set -g clock-mode-colour colour250

# ---- Status bar: every value is its own labeled pill ------------------------
set -g status-left-length 30
set -g status-right-length 220

set -g status-left "#[fg=colour233,bg=colour253,bold] #S #[fg=colour253,bg=default] "

setw -g window-status-format "#[fg=colour244,bg=colour235] #I:#W #[fg=colour235,bg=default] "
setw -g window-status-current-format "#[fg=colour233,bg=colour253,bold] #I:#W #[fg=colour253,bg=default] "
setw -g window-status-activity-style "fg=colour253,bg=default"
setw -g window-status-bell-style "fg=colour233,bg=colour253,bold"
setw -g window-status-separator ""

# Each metric: [ LABEL value ] as one filled pill, 2-space gap to the next.
#   GIT    — git branch of the active pane's directory (only in a repo)
#   TARGET — host/IP set with prefix+T (blank until you set one)
#   CPU    — load average, 1/5/15 min
#   RAM    — % RAM in use
#   DOCK   — running Docker containers
#   IP     — real LAN + Tailscale addresses (docker bridge noise filtered out)
#   clock / host
set -g status-right "#(git -C #{pane_current_path} rev-parse --abbrev-ref HEAD 2>/dev/null | awk '{print \"#[fg=colour233,bg=colour248,bold] GIT \" $0 \" #[fg=colour248,bg=default]  \"}')#(cat ~/.tmux_target 2>/dev/null | awk '{print \"#[fg=colour233,bg=colour253,bold] TARGET \" $0 \" #[fg=colour253,bg=default]  \"}')#[fg=colour233,bg=colour248,bold] CPU #(cut -d' ' -f1-3 /proc/loadavg) #[fg=colour248,bg=default]  #[fg=colour233,bg=colour248,bold] RAM #(free -m | awk 'NR==2{printf \"%d%%\",$3*100/$2}') #[fg=colour248,bg=default]  #[fg=colour233,bg=colour248,bold] DOCK #(docker ps -q 2>/dev/null | wc -l | tr -d ' ') #[fg=colour248,bg=default]  #[fg=colour233,bg=colour248,bold] IP #(ip -4 -o addr show scope global 2>/dev/null | grep -Ev 'docker0|br-' | awk '{print $4}' | cut -d/ -f1 | paste -sd, -) #[fg=colour248,bg=default]  #[fg=colour233,bg=colour253,bold] %H:%M #[fg=colour253,bg=default]  #[fg=colour233,bg=colour248,bold] #h #[fg=colour248,bg=default] "
